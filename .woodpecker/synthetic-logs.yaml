# Synthetic load (S0-3): one step writes a large log, as a sanitizer or MTR
# step does. The checker in synthetic-check.yaml compares how long it took
# against .woodpecker/synthetic/budgets.json, and checks that its log holds
# every line, in order. Runs only on the "synthetic"
# cron or a manual run with TASK=synthetic, never on pushes or pull requests.
when:
  - event: cron
    cron: synthetic
  - event: manual
    evaluate: 'TASK == "synthetic"'

skip_clone: true

steps:
  - name: big-log
    image: docker.io/alpine:3.24
    environment:
      # 3 million numbered lines of 100 bytes: 300 MB
      LINES: '3000000'
    commands:
      - awk -v n="$LINES" 'BEGIN { for (i = 1; i <= n; i++) printf "%09d synthetic log line padded to one hundred bytes ..........................................\n", i }'
