variables:
  - &golang_image 'docker.io/golang:1.27'
  - &node_image 'docker.io/node:24-alpine'
  - &alpine_image 'docker.io/alpine:3.24'
  - path: &when_path
      - 'docs/**'
      - '.woodpecker/docs.yaml'
      # since we generate docs for cli tool we have to watch this too
      - 'cli/**'
      - 'cmd/cli/**'
      # api docs
      - 'server/api/**'
  - path: &docker_path # web source code
      - 'web/**'
      # api source code
      - 'server/api/**'
      # go source code
      - '**/*.go'
      - 'go.*'
      # schema changes
      - 'pipeline/schema/**'
      # Dockerfile changes
      - 'docker/**'

when:
  - event: tag
  - event: pull_request
  - event: push
    path:
      - <<: *when_path
      - <<: *docker_path
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
  - event: manual
    evaluate: 'TASK == "docs"'

steps:
  - name: install-dependencies
    image: *node_image
    directory: docs/
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
    when:
      - path: *when_path
        event: [tag, pull_request, push]
      - event: manual

  - name: format-check
    image: *node_image
    directory: docs/
    commands:
      - corepack enable
      - pnpm format:check
    when:
      - path: *when_path
        event: pull_request

  - name: build-cli
    image: *golang_image
    commands:
      - make generate-docs
    when:
      - path: *when_path
        event: [tag, pull_request, push]
      - event: manual

  - name: build
    image: *node_image
    directory: docs/
    commands:
      - corepack enable
      - pnpm build
    when:
      - path: *when_path
        event: [tag, pull_request, push]
      - event: manual
