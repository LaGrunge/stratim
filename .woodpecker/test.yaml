variables:
  - &golang_image 'docker.io/golang:1.27'
  - &when
    - path: &when_path # related config files
        - '.woodpecker/test.yaml'
        - '.golangci.yaml'
        # go source code
        - '**/*.go'
        - 'go.*'
        # schema changes
        - 'pipeline/schema/**'
        # tools updates
        - Makefile
        - 'codecov.yaml'
      event: pull_request

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: *when_path

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor
    when:
      path:
        - <<: *when_path
        - '.woodpecker/**'

  lint-pipeline:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - go run go.woodpecker-ci.org/woodpecker/v3/cmd/cli lint
    environment:
      WOODPECKER_DISABLE_UPDATE_CHECK: true
      WOODPECKER_LINT_STRICT: true
      WOODPECKER_PLUGINS_PRIVILEGED: 'docker.io/woodpeckerci/plugin-docker-buildx'
    when:
      - event: pull_request
        path:
          - '.woodpecker/**'

  dummy-web:
    image: *golang_image
    commands:
      - mkdir -p web/dist/
      - echo "test" > web/dist/index.html
    when:
      - path: *when_path

  lint:
    depends_on:
      - vendor
    image: golangci/golangci-lint:v2.15.0
    commands:
      - make lint
    when: *when

  check-openapi:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - 'make generate-openapi'
      - 'DIFF=$(git diff | head)'
      - '[ -n "$DIFF" ] && { echo "openapi not up to date, exec make generate-openapi and commit"; exit 1; } || true'
    when: *when

  lint-license-header:
    image: *golang_image
    commands:
      - make install-addlicense # cspell:words addlicense
      # plugins/clone and plugins/s3 started as Drone plugins and carry their
      # own Apache-2.0 LICENSE; a "Woodpecker Authors" header would misstate
      # who holds the copyright.
      - bash -c 'shopt -s globstar; addlicense -check -ignore "vendor/**" -ignore cmd/server/openapi/docs.go -ignore "plugins/clone/**" -ignore "plugins/s3/**" **/*.go'
    when: *when

  test:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make test-agent
      - make test-server
      - make test-cli
      - make test-lib
    when:
      - path: *when_path

  test-e2e:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make test-e2e
    when:
      - path: *when_path

  test-fuzz:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - make fuzz
    environment:
      FUZZ_TIME: 2s
    when:
      - path: *when_path

  # Stratim runs on MariaDB only; sqlite and postgres stay informational until
  # their drivers are removed in phase 1.
  sqlite:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: sqlite3
    commands:
      - make test-server-datastore
    when:
      - path: *when_path
    failure: ignore

  postgres:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE: 'host=postgres user=postgres dbname=postgres sslmode=disable' # cspell:disable-line
    commands:
      - make test-server-datastore
    when: *when
    failure: ignore

  mariadb:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      WOODPECKER_DATABASE_DRIVER: mysql
      WOODPECKER_DATABASE_DATASOURCE: root@tcp(mariadb:3306)/test?parseTime=true
    commands:
      # the image restarts its server once after initializing the data
      # directory, with networking off until then
      - timeout 120 bash -c 'until (exec 3<>/dev/tcp/mariadb/3306) 2>/dev/null; do sleep 1; done'
      - make test-server-datastore-coverage
      # the fixture generator runs only by hand; keep it compiling
      - go vet -tags 'test fixturegen' ./server/store/datastore/migration/
    when: *when

  codecov:
    depends_on:
      - test
      - mariadb
    pull: true
    image: docker.io/woodpeckerci/plugin-codecov:2.3.3
    settings:
      files:
        - agent-coverage.out
        - cli-coverage.out
        - coverage.out
        - server-coverage.out
        - datastore-coverage.out
        - e2e-coverage.out
      token:
        from_secret: codecov_token
    when:
      - path: *when_path
    failure: ignore

services:
  postgres:
    image: docker.io/postgres:18
    ports: ['5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    when: *when

  mariadb:
    image: docker.io/mariadb:13.0
    ports: ['3306']
    environment:
      MARIADB_DATABASE: test
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
    when: *when
