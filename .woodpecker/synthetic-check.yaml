# Synthetic load (S0-3): reads this very pipeline from the API once the other
# synthetic workflows are done, whatever their outcome, and fails when one of
# them broke a budget in .woodpecker/synthetic/budgets.json. See
# synthetic-logs.yaml for when it runs.
#
# status lists every outcome when.status knows: the check also has to report
# synthetic workflows that failed, and a missing or skipped one shows up as a
# broken budget.
#
# Not yet here: a step that hits its timeout. Timeouts are set per repository
# today; S0-6 makes them workflow settings and adds that workflow.
when:
  - event: cron
    cron: synthetic
    status: [success, failure]
  - event: manual
    evaluate: 'TASK == "synthetic"'
    status: [success, failure]

depends_on:
  - synthetic-logs
  - synthetic-tests
  - synthetic-parallel-a
  - synthetic-parallel-b

steps:
  - name: check
    image: docker.io/golang:1.27
    environment:
      STRATIM_API_URL:
        from_secret: stratim_api_url
      STRATIM_API_TOKEN:
        from_secret: stratim_api_token
    commands:
      - go run ./tools/synthetic-check -budgets .woodpecker/synthetic/budgets.json
