services:
- image: docker.io/woodpeckerci/plugin-trivy:1.6.1
  name: server
  ports:
  - 10000
  settings:
    db-repository: mirror.gcr.io/aquasec/trivy-db:2
steps:
- depends_on: []
  image: docker.io/woodpeckerci/plugin-trivy:1.6.1
  name: backend
  settings:
    server: server
    skip-dirs: web/,docs/
- depends_on: []
  image: docker.io/woodpeckerci/plugin-trivy:1.6.1
  name: docs
  settings:
    dir: docs/
    server: server
    skip-dirs: node_modules/,plugins/woodpecker-plugins/node_modules/
- depends_on: []
  image: docker.io/woodpeckerci/plugin-trivy:1.6.1
  name: web
  settings:
    dir: web/
    server: server
    skip-dirs: node_modules/
when:
- event:
  - pull_request
- branch:
  - ${CI_REPO_DEFAULT_BRANCH}
  event: push
