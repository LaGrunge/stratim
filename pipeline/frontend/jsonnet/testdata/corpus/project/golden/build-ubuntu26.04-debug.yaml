steps:
- commands:
  - cmake -B build -DCMAKE_BUILD_TYPE=Debug
  - cmake --build build -j"$(nproc)"
  environment:
    BUILD_TYPE: Debug
  image: docker.io/library/ubuntu:26.04
  name: build
- commands:
  - ctest --test-dir build --output-on-failure
  depends_on:
  - build
  image: docker.io/library/ubuntu:26.04
  name: test
when:
- branch: main
  event: push
- event: pull_request
  path:
    exclude:
    - '**/*.md'
    include:
    - src/**
    - CMakeLists.txt
